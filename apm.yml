name: bb
version: 1.0.0
description: APM project for Copilot Agents
author: webmaxru
# This project targets GitHub Copilot only.
#
# Pinned deliberately: `apm install` otherwise auto-detects its target from
# whichever agent directory happens to exist. It found .claude/ and deployed
# there alone - a path that is gitignored here and that Copilot CLI does not
# read - so installed skills were invisible to the agent actually in use, while
# the install still reported success. Copilot reads .agents/skills/ and
# .github/prompts/.
target: copilot
dependencies:
  apm:
  - webmaxru/ai-native-dev/skills/agent-package-manager
  - anthropics/skills/skills/frontend-design
  - rysweet/amplihack-rs/amplifier-bundle/skills/storytelling-synthesizer#b123c107c7ab2e3d436926747c135e78a90545b6
  - webmaxru/ai-native-dev/prompts/seo-and-agent-readiness.prompt.md#main
  - webmaxru/cookieless-insights/skills/cookieless-insights
  mcp: []
includes: auto
scripts: {}
