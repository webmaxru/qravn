## Captures the App Store screenshots on a hosted Mac.
##
## The developer machine for this project is Windows, and only Apple ships the
## iOS simulator, so this is how the listing images get taken. It is manual
## rather than part of CI: it boots a simulator and sleeps for animations, which
## is a poor fit for a check that runs on every pull request, and the output is
## reviewed by a human before it goes near App Store Connect.
##
## Run it from the Actions tab, download the `app-store-screenshots` artifact,
## unzip it over brand/app-store/screenshots/ and commit what you keep.
##
## GitHub only offers a manual trigger for a workflow already on the default
## branch, so while this file lives on a feature branch it is absent from the
## Actions tab and `gh workflow run` answers 404. That is the rule, not a
## broken file. Merge it, or run the script directly on a Mac.
name: App Store screenshots

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the captured screenshots back to the branch
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  capture:
    name: Capture on a 6.9" simulator
    runs-on: macos-15
    timeout-minutes: 80
    permissions:
      # Only needed for the optional commit-back; the capture itself reads.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        # The runner defaults to Xcode 16.4 while shipping iOS 26 runtimes, and
        # the 6.9" iPhone the store asks for only exists on those. That pairing
        # does not fail, it hangs: the test target builds in two minutes and
        # xcodebuild never prints "Testing started". Take the newest Xcode so the
        # toolchain is at least as new as the runtime it has to drive.
        run: |
          newest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          echo "selecting $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Report toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          echo "--- Xcodes installed ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "--- iOS runtimes ---"
          xcrun simctl list runtimes 2>/dev/null | grep -i ios || true
          echo "--- 6.9\" devices ---"
          xcrun simctl list devices available 2>/dev/null | grep -E "Pro Max|^--" || true

      # The pictures show verdicts, and every verdict in this product comes from
      # the Rust core. Building the real core is therefore not optional here
      # either: a screenshot of a stub would be a screenshot of a different app.
      - name: Install Rust stable with Apple targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ios-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Capture
        # A step-level timeout fails this step and lets the ones below it run.
        # The job-level timeout does the opposite: it cancels them, which is how
        # the first run of this workflow spent an hour hanging on a simulator
        # boot and then uploaded nothing to explain itself.
        #
        # The script bounds and retries each locale itself, so this is the outer
        # backstop rather than the working limit: two locales, two attempts, at
        # twelve minutes each.
        timeout-minutes: 55
        run: bash apps/ios/scripts/capture-store-screenshots.sh

      # The pictures are what this job exists to produce, so they go up whatever
      # the verdict below them was. A capture can succeed and still fail the
      # step: the slot check at the end of the script compares the new files
      # against the registry, and on a first capture the registry has not been
      # told about them yet. Losing the images to that would mean running the
      # whole job again to get them back.
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: brand/app-store/screenshots/
          retention-days: 30
          if-no-files-found: ignore

      # The result bundles carry a frame-by-frame record of what the app did,
      # which is the only way to see why a capture came out wrong. `failure()`
      # alone would skip this on a cancellation, which is exactly the case that
      # needs it most.
      - name: Upload the result bundles on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-results
          path: apps/ios/.screenshots/*.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit the screenshots
        if: inputs.commit
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain brand/app-store/screenshots)" ]; then
            echo "::notice::The captured screenshots are identical to the committed ones."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/app-store/screenshots
          git commit -m "Capture App Store screenshots on a 6.9\" simulator"
          git push
