name: Deploy Resolver

# Builds the redirect resolver image, pushes it to GitHub Container Registry
# (ghcr.io - free for this private repo, unlike Azure Container Registry which
# bills a fixed ~USD 5/month at idle), and deploys it to Azure Container Apps.
#
# The Container App runs on the Consumption plan with minReplicas: 0, so it costs
# nothing while idle. See infra/resolver.bicep and infra/README.md for the full
# zero-idle-cost rationale.

on:
  push:
    branches: [main]
    paths:
      - 'services/resolver/**'
      - 'infra/**'
      - '.github/workflows/deploy-resolver.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy resolver to Azure Container Apps
    # Gated like deploy-web.yml (AZURE_SWA_ENABLED): inert until the user opts in
    # by setting the AZURE_ACA_ENABLED repository variable to 'true'. A manual
    # workflow_dispatch run is always allowed for testing.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && vars.AZURE_ACA_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # push the image to ghcr.io
      id-token: write   # OIDC federated login to Azure (no long-lived secret)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect resolver service
        id: inputs
        shell: bash
        run: |
          ready=true
          if [ ! -f services/resolver/Dockerfile ]; then
            echo "::notice::services/resolver/Dockerfile is not present yet; skipping deployment."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Check required configuration
        if: steps.inputs.outputs.ready == 'true'
        shell: bash
        env:
          # OIDC login inputs (client/tenant/subscription are identifiers, not
          # secrets, but are stored as secrets by convention).
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # Optional. A long-lived GHCR pull token (PAT with read:packages) that
          # the Container App stores and uses to pull a PRIVATE image on cold
          # start. The ephemeral GITHUB_TOKEN cannot be used for this because it
          # expires when the job ends. Leave unset when the ghcr.io package is
          # public: then no standing credential exists at all, which is the
          # better security posture. resolver.bicep omits the registry block
          # entirely when no password is supplied.
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          missing=false
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set. See infra/README.md."
              missing=true
            fi
          done
          if [ "$missing" = "true" ]; then exit 1; fi
          if [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "::notice::GHCR_PULL_TOKEN is not set. Deploying without registry credentials - this only works if the ghcr.io package is PUBLIC. If the app fails to start with an image-pull error, either make the package public or set GHCR_PULL_TOKEN. See infra/README.md."
          fi

      - name: Set up Docker Buildx
        if: steps.inputs.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.inputs.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN can PUSH to this repo's own packages; that is all it is
          # used for here. The Container App pulls with the long-lived PAT above.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: image
        if: steps.inputs.outputs.ready == 'true'
        shell: bash
        run: |
          # ghcr.io requires a lowercase image path. Tag with the commit SHA so
          # every deploy is an immutable, reproducible reference (no 'latest').
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${repo}/resolver:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: steps.inputs.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: services/resolver
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Container App runs with minReplicas 0, so it re-pulls the image on
      # every cold start - not just at deploy time. The pull credential is
      # therefore a permanent liveness dependency: if the PAT expires or is
      # revoked, the service stops coming back up, silently, long after this
      # workflow last ran green. Prove the credential can actually pull THIS
      # image now, so a bad or expired token fails here with a clear message
      # instead of surfacing later as an unexplained outage.
      - name: Verify the image is pullable with the stored credential
        if: steps.inputs.outputs.ready == 'true'
        shell: bash
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -uo pipefail
          # ghcr.io/<path>:<tag> -> <path>, <tag>
          path="${IMAGE_REF#ghcr.io/}"; tag="${path##*:}"; path="${path%:*}"
          scope="repository:${path}:pull"

          if [ -n "$GHCR_PULL_TOKEN" ]; then
            auth=(-u "${OWNER}:${GHCR_PULL_TOKEN}")
            mode="the stored GHCR_PULL_TOKEN"
          else
            auth=()
            mode="anonymous access (package must be public)"
          fi

          bearer="$(curl -s "${auth[@]}" \
            "https://ghcr.io/token?service=ghcr.io&scope=${scope}" | jq -r '.token // empty')"
          if [ -z "$bearer" ]; then
            echo "::error::ghcr.io refused to issue a pull token using ${mode}."
            exit 1
          fi

          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${bearer}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${path}/manifests/${tag}")"
          if [ "$code" != "200" ]; then
            echo "::error::Cannot pull ${IMAGE_REF} using ${mode} (HTTP ${code}). If GHCR_PULL_TOKEN is set, it is expired, revoked, or lacks the read:packages scope. If it is unset, the package is private. See infra/README.md."
            exit 1
          fi
          echo "Image is pullable using ${mode}."

      - name: Azure login (OIDC)
        if: steps.inputs.outputs.ready == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # A deploy that silently narrows CORS to localhost looks completely healthy:
      # /healthz still returns 200 and only real browsers fail, so online mode dies
      # for users while every signal stays green. RESOLVER_CORS_ALLOWED_ORIGINS is a
      # repo variable, so clearing or mistyping it would do exactly that. The
      # resolver deliberately falls back to localhost-only (closed, not wildcard),
      # which is safe but silent - so fail loudly here instead.
      - name: Verify the CORS allowlist still covers production
        if: steps.inputs.outputs.ready == 'true'
        shell: bash
        env:
          WEB_CUSTOM_HOSTNAME: ${{ vars.WEB_CUSTOM_HOSTNAME }}
          RESOLVER_CORS_ALLOWED_ORIGINS: ${{ vars.RESOLVER_CORS_ALLOWED_ORIGINS }}
        run: |
          origins="$(printf '%s' "$RESOLVER_CORS_ALLOWED_ORIGINS" | tr -d '[:space:]')"
          if [ -z "$origins" ]; then
            echo "::error::RESOLVER_CORS_ALLOWED_ORIGINS is empty. The resolver would fall back to localhost-only origins, so online mode would break in the browser while /healthz still reported healthy."
            exit 1
          fi
          case "$origins" in
            *https://*) ;;
            *)
              echo "::error::RESOLVER_CORS_ALLOWED_ORIGINS contains no https:// origin (value: $origins). Production browsers would be refused."
              exit 1
              ;;
          esac
          if [ -n "$WEB_CUSTOM_HOSTNAME" ]; then
            case ",$origins," in
              *",https://$WEB_CUSTOM_HOSTNAME,"*) ;;
              *)
                echo "::error::WEB_CUSTOM_HOSTNAME is '$WEB_CUSTOM_HOSTNAME' but https://$WEB_CUSTOM_HOSTNAME is absent from RESOLVER_CORS_ALLOWED_ORIGINS. The custom domain would be refused by the resolver."
                exit 1
                ;;
            esac
          fi
          echo "CORS allowlist covers production: $origins"

      - name: Deploy to Azure Container Apps
        id: deploy
        if: steps.inputs.outputs.ready == 'true'
        shell: bash
        env:
          # Passed via env so the token text is never rendered into the command
          # line. GitHub also masks registered secrets in logs. registryPassword
          # is a @secure() Bicep param, so it never appears in deployment history.
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-qravn' }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          WEB_CUSTOM_HOSTNAME: ${{ vars.WEB_CUSTOM_HOSTNAME }}
          RESOLVER_CUSTOM_HOSTNAME: ${{ vars.RESOLVER_CUSTOM_HOSTNAME }}
          # Must match the environmentName default in infra/resolver.bicep. Only
          # used to find the managed certificate before deploying.
          ENVIRONMENT_NAME: ${{ vars.AZURE_RESOLVER_ENVIRONMENT || 'qravn-resolver-env' }}
          RESOLVER_CORS_ALLOWED_ORIGINS: ${{ vars.RESOLVER_CORS_ALLOWED_ORIGINS }}
          # Deliberately github.repository_owner, NOT github.actor. The stored
          # credential is a PAT belonging to the repository owner, so the username
          # must be stable. github.actor is whoever triggered the run - a
          # Dependabot push would store 'dependabot[bot]' against the owner's PAT
          # and the Container App would then fail to pull on its next cold start,
          # long after the deploy reported success.
          REGISTRY_USER: ${{ github.repository_owner }}
        run: |
          # The custom domain binding lives in the template, so the certificate
          # id has to be supplied on every deployment. Look it up by subject
          # rather than by name: Azure generates the managed certificate name
          # with a random suffix. An empty result is normal before the
          # certificate has been issued, and leaves the domain unbound.
          cert_id=""
          if [ -n "$RESOLVER_CUSTOM_HOSTNAME" ]; then
            cert_id="$(az containerapp env certificate list \
              --name "$ENVIRONMENT_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.subjectName=='$RESOLVER_CUSTOM_HOSTNAME' && properties.provisioningState=='Succeeded'].id | [0]" \
              --output tsv 2>/dev/null || true)"
            [ "$cert_id" = "None" ] && cert_id=""
            if [ -z "$cert_id" ]; then
              echo "No issued certificate for $RESOLVER_CUSTOM_HOSTNAME yet; deploying without the custom domain."
            fi
          fi
          url="$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/resolver.bicep \
            --parameters \
              containerImage="$IMAGE_REF" \
              registryServer="ghcr.io" \
              registryUsername="$REGISTRY_USER" \
              registryPassword="$GHCR_PULL_TOKEN" \
              webCustomHostname="$WEB_CUSTOM_HOSTNAME" \
              resolverCustomHostname="$RESOLVER_CUSTOM_HOSTNAME" \
              resolverCertificateId="$cert_id" \
              resolverCorsAllowedOrigins="$RESOLVER_CORS_ALLOWED_ORIGINS" \
            --query "properties.outputs.resolverUrl.value" \
            --output tsv)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Resolver URL: $url"

      # A successful ARM deployment only means the resource was accepted. If the
      # image cannot be pulled (private package with no credential) the app stays
      # down and every later request degrades to "could not follow the link" with
      # no obvious cause. Prove it actually serves before calling this a success.
      - name: Verify the resolver is actually serving
        if: steps.inputs.outputs.ready == 'true'
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Deployment produced no resolver URL."
            exit 1
          fi
          # minReplicas is 0, so the first request pays a cold start. Retry.
          for attempt in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/healthz" || true)"
            if [ "$code" = "200" ]; then
              echo "Resolver healthy at $URL/healthz (attempt $attempt)."
              exit 0
            fi
            echo "attempt $attempt: /healthz returned '$code'; retrying in 10s"
            sleep 10
          done
          echo "::error::Resolver never became healthy. The most likely cause is an image pull failure: the ghcr.io package is private and GHCR_PULL_TOKEN is unset. Make the package public or set the token. See infra/README.md."
          exit 1
