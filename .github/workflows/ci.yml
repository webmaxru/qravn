name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect core workspace
        id: core
        shell: bash
        run: |
          if [ -f core/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::core/Cargo.toml is not present yet; skipping Rust core checks."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        if: steps.core.outputs.present == 'true'
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown

      - name: Use Rust stable
        if: steps.core.outputs.present == 'true'
        run: rustup default stable

      - name: Cache cargo
        if: steps.core.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        if: steps.core.outputs.present == 'true'
        working-directory: core
        run: cargo fmt --all --check

      - name: Run clippy
        if: steps.core.outputs.present == 'true'
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        if: steps.core.outputs.present == 'true'
        working-directory: core
        run: cargo test --all

      # Hard portability gate: the security core must stay free of APIs that cannot run in browsers.
      - name: Build safety core for wasm32
        if: steps.core.outputs.present == 'true'
        working-directory: core
        run: cargo build --target wasm32-unknown-unknown -p safety-core

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect web app
        id: web
        shell: bash
        run: |
          if [ -f apps/web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/web/package.json is not present yet; skipping web checks."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.web.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The web app imports the compiled core, so CI must build the WebAssembly package
      # before type checking, testing or building the app. Without this the web job
      # would only ever pass against a mock and would go red the moment the real
      # engine is wired in.
      - name: Install Rust stable
        if: steps.web.outputs.present == 'true'
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Install wasm-pack
        if: steps.web.outputs.present == 'true'
        run: npm install --global wasm-pack@0.15.0

      - name: Build WASM package
        if: steps.web.outputs.present == 'true'
        working-directory: core/bindings/wasm
        run: wasm-pack build --target web --out-dir pkg

      - name: Install dependencies
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npm ci

      # Static accessibility and correctness gate. oxlint runs the jsx-a11y
      # recommended ruleset (configured in apps/web/.oxlintrc.json), so markup
      # regressions such as an unlabeled control or a click handler on a
      # non-interactive element fail the build before they can reach a browser.
      - name: Lint
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npm run lint

      - name: Type check
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Run tests
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npm run test -- --run

      - name: Build
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect web app
        id: web
        shell: bash
        run: |
          if [ -f apps/web/playwright.config.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/web/playwright.config.ts is not present yet; skipping browser tests."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.web.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Rust stable
        if: steps.web.outputs.present == 'true'
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Install wasm-pack
        if: steps.web.outputs.present == 'true'
        run: npm install --global wasm-pack@0.15.0

      - name: Build WASM package
        if: steps.web.outputs.present == 'true'
        working-directory: core/bindings/wasm
        run: wasm-pack build --target web --out-dir pkg

      - name: Install dependencies
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npm ci

      # WebKit is the only proxy available in CI for iOS Safari, which is a large
      # share of the Norwegian market. Reducing this matrix to Chromium would hide
      # exactly the failures most likely to reach real users.
      - name: Install Playwright browsers
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npm run test:browser

      - name: Upload report on failure
        if: failure() && steps.web.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Android app
        id: android
        shell: bash
        run: |
          if [ -f apps/android/settings.gradle.kts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/android/settings.gradle.kts is not present yet; skipping Android checks."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        if: steps.android.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        if: steps.android.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v6

      # The Rust core is the single source of every verdict and the Android
      # client is not allowed to re-derive one, so CI builds the real JNI
      # binding rather than passing -Pqravn.skipNativeBuild. x86_64 is in the
      # list because the emulator below needs it.
      - name: Install Rust stable with Android targets
        if: steps.android.outputs.present == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Cache cargo
        if: steps.android.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install cargo-ndk
        if: steps.android.outputs.present == 'true'
        run: |
          if ! command -v cargo-ndk >/dev/null; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi

      - name: Install Android NDK
        if: steps.android.outputs.present == 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "ndk;28.2.13676358"

      - name: Run unit tests
        if: steps.android.outputs.present == 'true'
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :safety-core:testDebugUnitTest

      # lint runs with warningsAsErrors, so this also catches unused resources,
      # missing translations and accessibility problems in the Compose tree.
      - name: Lint
        if: steps.android.outputs.present == 'true'
        working-directory: apps/android
        run: ./gradlew :app:lintDebug

      # assemble and bundle both depend on verify{Variant}OfflineManifest, which
      # fails the build if any permission beyond CAMERA reaches the merged
      # manifest. That is the offline invariant, enforced rather than documented.
      - name: Build release artifacts
        if: steps.android.outputs.present == 'true'
        working-directory: apps/android
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      # Hardware acceleration is off by default on the runners, and without it
      # the emulator is too slow to finish inside any sane timeout.
      - name: Enable KVM
        if: steps.android.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # These guard product invariants, not styling: that a refused verdict
      # offers no way to open the link, that a result never appears without its
      # destination, and — in the safety-core suite — that the real Rust core
      # actually loads through JNI with its catalogs packaged. A JVM test would
      # not notice a library that fails to load or a drifted symbol name.
      - name: Run instrumented tests
        if: steps.android.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          # API 35 rather than the compileSdk. The hosted runner's API 36
          # google_apis image never finished booting inside the action's
          # ten-minute window, and these tests assert product behaviour that is
          # not version-specific. minSdk is 26, so testing one release below
          # target is closer to what users actually run.
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: apps/android
          disable-animations: true
          emulator-boot-timeout: 1200
          # No camera device: the emulated webcam is boot work this suite never
          # needs. These tests exercise the result panel's Compose tree and the
          # JNI core directly; neither opens the viewfinder.
          emulator-options: >-
            -no-window -no-snapshot -noaudio -no-boot-anim -no-metrics
            -camera-back none -camera-front none -gpu swiftshader_indirect
          script: ./gradlew :safety-core:connectedDebugAndroidTest :app:connectedDebugAndroidTest

      - name: Upload reports on failure
        if: failure() && steps.android.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/
            apps/android/safety-core/build/reports/
          retention-days: 7

  ios:
    name: iOS app
    # The only macOS in this project. The developer machine is Windows, so this
    # runner is the compiler, the simulator and the reviewer for everything
    # under apps/ios.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect iOS app
        id: ios
        shell: bash
        run: |
          if [ -f apps/ios/project.yml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/ios/project.yml is not present yet; skipping iOS checks."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report toolchain
        if: steps.ios.outputs.present == 'true'
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      # Same rule as Android: the client never re-derives a verdict, so CI
      # builds the real Rust core rather than a stub. Both simulator slices are
      # installed so the XCFramework is valid on Intel and Apple Silicon.
      - name: Install Rust stable with Apple targets
        if: steps.ios.outputs.present == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Cache cargo
        if: steps.ios.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ios-

      - name: Install XcodeGen
        if: steps.ios.outputs.present == 'true'
        run: brew install xcodegen

      # Order matters and mirrors the web app: the native package is produced
      # first, then the project that consumes it is generated, then the build
      # runs. No Xcode run script phase touches cargo.
      - name: Build the Rust core as an XCFramework
        if: steps.ios.outputs.present == 'true'
        run: bash apps/ios/scripts/build-core.sh

      - name: Generate the Xcode project
        if: steps.ios.outputs.present == 'true'
        working-directory: apps/ios
        run: xcodegen generate

      # The runner image's simulator set changes between releases, so the
      # destination is resolved rather than hard-coded to a device name.
      - name: Choose a simulator
        id: simulator
        if: steps.ios.outputs.present == 'true'
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "::error::No available iPhone simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      - name: Build
        if: steps.ios.outputs.present == 'true'
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project QRavn.xcodeproj \
            -scheme QravnApp \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath build-results.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # These guard product invariants, not styling: that the real Rust core
      # loads through the C ABI with its catalogs packaged, that a blocked
      # verdict offers no way to open the link, and that nothing but http and
      # https can ever leave the app.
      - name: Test
        if: steps.ios.outputs.present == 'true'
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project QRavn.xcodeproj \
            -scheme QravnApp \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath test-results.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # A build setting that fails to expand still builds, still tests, and is
      # then rejected by App Store validation at the end of a long archive. The
      # icon and the privacy manifest are the same shape of problem: nothing
      # here is exercised by a simulator run, so assert the bundle directly.
      - name: Check the app bundle is shippable
        if: steps.ios.outputs.present == 'true'
        working-directory: apps/ios
        run: |
          set -o pipefail
          products=$(xcodebuild -project QRavn.xcodeproj -scheme QravnApp \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -showBuildSettings CODE_SIGNING_ALLOWED=NO \
            | awk -F' = ' '/ BUILT_PRODUCTS_DIR = /{print $2; exit}')
          app="$products/QravnApp.app"
          plist="$app/Info.plist"
          short=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          echo "version $short ($build)"
          case "$short$build" in
            *'$('*)
              echo "::error::Info.plist kept a literal build setting; the upload would be rejected."
              exit 1
              ;;
          esac
          for required in AppIcon60x60@2x.png PrivacyInfo.xcprivacy; do
            if [ ! -f "$app/$required" ]; then
              echo "::error::$required is missing from the built app."
              ls -1 "$app"
              exit 1
            fi
          done

      - name: Upload results on failure
        if: failure() && steps.ios.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-results
          path: |
            apps/ios/*.xcresult
          retention-days: 7

  contract:
    name: Contract and localization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned because the store asset tests below are run through node --test
      # with a glob, which the runner only expands itself from Node 21 on. The
      # other steps here are version-agnostic, so this job previously took
      # whatever the image happened to ship.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check contract registry and localization catalogs
        run: node tools/check-contract-localization.js

      # No store truncates: an over-length name or description is rejected at
      # upload, after every other form has been filled in. Covers the Play, App
      # Store and Microsoft Store listings.
      - name: Check store listing field lengths
        run: node tools/check-store-listings.mjs

      # Same failure mode as the field lengths, one layer down: every store
      # validates image dimensions at upload and none of them resizes. The App
      # Store also rejects a marketing icon that carries an alpha channel, which
      # is invisible in a file listing and obvious only in a rejection email.
      - name: Check store image dimensions and formats
        run: node tools/check-store-images.mjs

      # Both checks above read brand/store-assets.json, which is the list of
      # every slot the three stores offer. brand/STORE-ASSETS.md is generated
      # from it, so this fails when the two have parted company — otherwise the
      # document people actually read slowly stops describing what is checked.
      - name: Check the store asset document is current
        run: node tools/gen-store-assets-doc.mjs --check

      # The three checks above are the only thing standing between a bad
      # registry edit and a store rejection, so they get tests of their own.
      # Each case builds a throwaway tree and mutates one field of a
      # known-good fixture, which is how a checker that silently stops
      # checking something gets caught. Node expands the glob itself, so this
      # behaves the same on a shell that would not.
      - name: Test the store asset tooling
        run: node --test "tools/*.test.mjs"

      # The copy leads with how many checks the engine runs. That is a claim
      # about a security product, so it is asserted against the registry rather
      # than trusted: adding a finding code without touching the store copy
      # would leave every surface quoting a number that is no longer true.
      - name: Check claimed check counts against the registry
        run: node tools/check-claimed-checks.mjs

      # Stronger than the registry check: asserts every {placeholder} used in a
      # localized string is actually declared for that code in the registry.
      # A message referencing an undeclared param renders literally to the user.
      - name: Validate localization placeholders and golden vectors
        run: node tools/validate-l10n.mjs

      # The web app's copy of the contract is generated, not hand-written. It had
      # already drifted once and was silently missing types, which the compiler
      # accepts happily because the old shape is still internally consistent.
      - name: Check generated contract copy is current
        run: node tools/sync-contract.mjs --check
