name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect core workspace
        id: core
        shell: bash
        run: |
          if [ -f core/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::core/Cargo.toml is not present yet; skipping Rust core checks."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        if: steps.core.outputs.present == 'true'
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown

      - name: Use Rust stable
        if: steps.core.outputs.present == 'true'
        run: rustup default stable

      - name: Cache cargo
        if: steps.core.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        if: steps.core.outputs.present == 'true'
        working-directory: core
        run: cargo fmt --all --check

      - name: Run clippy
        if: steps.core.outputs.present == 'true'
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        if: steps.core.outputs.present == 'true'
        working-directory: core
        run: cargo test --all

      # Hard portability gate: the security core must stay free of APIs that cannot run in browsers.
      - name: Build safety core for wasm32
        if: steps.core.outputs.present == 'true'
        working-directory: core
        run: cargo build --target wasm32-unknown-unknown -p safety-core

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect web app
        id: web
        shell: bash
        run: |
          if [ -f apps/web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/web/package.json is not present yet; skipping web checks."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.web.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The web app imports the compiled core, so CI must build the WebAssembly package
      # before type checking, testing or building the app. Without this the web job
      # would only ever pass against a mock and would go red the moment the real
      # engine is wired in.
      - name: Install Rust stable
        if: steps.web.outputs.present == 'true'
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Install wasm-pack
        if: steps.web.outputs.present == 'true'
        run: npm install --global wasm-pack@0.15.0

      - name: Build WASM package
        if: steps.web.outputs.present == 'true'
        working-directory: core/bindings/wasm
        run: wasm-pack build --target web --out-dir pkg

      - name: Install dependencies
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npm ci

      # Static accessibility and correctness gate. oxlint runs the jsx-a11y
      # recommended ruleset (configured in apps/web/.oxlintrc.json), so markup
      # regressions such as an unlabeled control or a click handler on a
      # non-interactive element fail the build before they can reach a browser.
      - name: Lint
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npm run lint

      - name: Type check
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Run tests
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npm run test -- --run

      - name: Build
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect web app
        id: web
        shell: bash
        run: |
          if [ -f apps/web/playwright.config.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/web/playwright.config.ts is not present yet; skipping browser tests."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.web.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Rust stable
        if: steps.web.outputs.present == 'true'
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Install wasm-pack
        if: steps.web.outputs.present == 'true'
        run: npm install --global wasm-pack@0.15.0

      - name: Build WASM package
        if: steps.web.outputs.present == 'true'
        working-directory: core/bindings/wasm
        run: wasm-pack build --target web --out-dir pkg

      - name: Install dependencies
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npm ci

      # WebKit is the only proxy available in CI for iOS Safari, which is a large
      # share of the Norwegian market. Reducing this matrix to Chromium would hide
      # exactly the failures most likely to reach real users.
      - name: Install Playwright browsers
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser tests
        if: steps.web.outputs.present == 'true'
        working-directory: apps/web
        run: npm run test:browser

      - name: Upload report on failure
        if: failure() && steps.web.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Android app
        id: android
        shell: bash
        run: |
          if [ -f apps/android/settings.gradle.kts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/android/settings.gradle.kts is not present yet; skipping Android checks."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        if: steps.android.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        if: steps.android.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v6

      # The Rust core is the single source of every verdict and the Android
      # client is not allowed to re-derive one, so CI builds the real JNI
      # binding rather than passing -Pqrrrgh.skipNativeBuild. x86_64 is in the
      # list because the emulator below needs it.
      - name: Install Rust stable with Android targets
        if: steps.android.outputs.present == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Cache cargo
        if: steps.android.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            core/target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install cargo-ndk
        if: steps.android.outputs.present == 'true'
        run: |
          if ! command -v cargo-ndk >/dev/null; then
            cargo install cargo-ndk --version 4.1.2 --locked
          fi

      - name: Install Android NDK
        if: steps.android.outputs.present == 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "ndk;28.2.13676358"

      - name: Run unit tests
        if: steps.android.outputs.present == 'true'
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :safety-core:testDebugUnitTest

      # lint runs with warningsAsErrors, so this also catches unused resources,
      # missing translations and accessibility problems in the Compose tree.
      - name: Lint
        if: steps.android.outputs.present == 'true'
        working-directory: apps/android
        run: ./gradlew :app:lintDebug

      # assemble and bundle both depend on verify{Variant}OfflineManifest, which
      # fails the build if any permission beyond CAMERA reaches the merged
      # manifest. That is the offline invariant, enforced rather than documented.
      - name: Build release artifacts
        if: steps.android.outputs.present == 'true'
        working-directory: apps/android
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      # Hardware acceleration is off by default on the runners, and without it
      # the emulator is too slow to finish inside any sane timeout.
      - name: Enable KVM
        if: steps.android.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # These guard product invariants, not styling: that a refused verdict
      # offers no way to open the link, that a result never appears without its
      # destination, and — in the safety-core suite — that the real Rust core
      # actually loads through JNI with its catalogs packaged. A JVM test would
      # not notice a library that fails to load or a drifted symbol name.
      - name: Run instrumented tests
        if: steps.android.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          working-directory: apps/android
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew :safety-core:connectedDebugAndroidTest :app:connectedDebugAndroidTest

      - name: Upload reports on failure
        if: failure() && steps.android.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/
            apps/android/safety-core/build/reports/
          retention-days: 7

  contract:
    name: Contract and localization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check contract registry and localization catalogs
        run: node tools/check-contract-localization.js

      # Stronger than the registry check: asserts every {placeholder} used in a
      # localized string is actually declared for that code in the registry.
      # A message referencing an undeclared param renders literally to the user.
      - name: Validate localization placeholders and golden vectors
        run: node tools/validate-l10n.mjs

      # The web app's copy of the contract is generated, not hand-written. It had
      # already drifted once and was silently missing types, which the compiler
      # accepts happily because the old shape is still internally consistent.
      - name: Check generated contract copy is current
        run: node tools/sync-contract.mjs --check
