<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" width="340" height="120"
     role="img" aria-label="QRavn">
  <title>QRavn</title>
  <!--
    Horizontal lockup: mark, clear space, wordmark.

    The wordmark is monospace, regular weight, tight. Monospace is the working
    font of this product because the thing it actually has to show you is a
    URL, character by character, closely enough that you can tell rn from m or
    spot a Cyrillic a. A proportional face hides exactly that.

    Sentence case, one weight, one colour: QRavn is a name, and the mark is
    already doing the talking.

    In the apps the wordmark is live text, not this file, so it inherits the
    platform monospace face and scales with the user's font size setting. This
    file exists for places that need a flat asset.
  -->
  <rect width="340" height="120" fill="#0C1519" />
  <path transform="translate(18 18) scale(12)" fill="#F1EDE6" fill-rule="evenodd"
        d="M0,0 H7 V5.5 H6 V1 H1 V6 H5.5 V7 H0 Z M2,2 H5 V5 H2 Z" />
  <text x="132" y="61" fill="#F1EDE6"
        font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace"
        font-size="54" letter-spacing="-1"
        dominant-baseline="central">QRavn</text>
</svg>
