<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" width="340" height="120"
     role="img" aria-label="qrrrgh">
  <title>qrrrgh</title>
  <!--
    Horizontal lockup: mark, clear space, wordmark.

    The wordmark is set in monospace, lowercase, regular weight, tight.
    Monospace is the working font of this product because the thing the app
    actually has to show you is a URL, character by character, closely enough
    that you can tell rn from m or spot a Cyrillic a. A proportional face hides
    exactly that. Lowercase and unbolded because "qrrrgh" is the noise you make
    at a suspicious sign in a car park, not a brand shouting.

    In the apps the wordmark is live text, not this file, so it inherits the
    platform monospace face and scales with the user's font size setting. This
    file exists for places that need a flat asset.
  -->
  <g transform="translate(16 16) scale(5.8667)" fill="#111315" fill-rule="evenodd">
    <path d="M0,0 H7 V7 H0 Z M1,1 H6 V6 H1 Z M2,2 H5 V5 H2 Z" />
    <path d="M8,0 H15 V7 H8 Z M9,1 H14 V6 H9 Z M10,2 H13 V5 H10 Z" />
    <path d="M0,8 H7 V15 H0 Z M1,9 H6 V14 H1 Z M2,10 H5 V13 H2 Z" />
  </g>
  <text x="132" y="61" fill="#111315"
        font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace"
        font-size="54" letter-spacing="-1"
        dominant-baseline="central">qrrrgh</text>
</svg>
