<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 15 15" width="150" height="150"
     role="img" aria-label="qrrrgh">
  <title>qrrrgh</title>
  <!--
    App icon variant of brand/mark.svg.

    Same three finders and the same empty fourth corner, drawn on a 15 module
    field instead of the authentic 21. At launcher size the true Version 1
    spacing puts each finder at a seventh of the width, which leaves a
    one-module ring roughly a pixel thick and the mark reads as grey mush.
    Tightening the gap keeps the idea and keeps the silhouette.

    Dark modules on a light ground, the way a real QR code is printed.
  -->
  <g fill="#111315" fill-rule="evenodd">
    <path d="M0,0 H7 V7 H0 Z M1,1 H6 V6 H1 Z M2,2 H5 V5 H2 Z" />
    <path d="M8,0 H15 V7 H8 Z M9,1 H14 V6 H9 Z M10,2 H13 V5 H10 Z" />
    <path d="M0,8 H7 V15 H0 Z M1,9 H6 V14 H1 Z M2,10 H5 V13 H2 Z" />
  </g>
</svg>
