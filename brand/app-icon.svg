<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="qrrrgh">
  <title>qrrrgh</title>
  <!--
    App icon. The mark on a paper tile, because a QR code is dark modules on a
    light ground and the icon should look like a fragment of a real one.
    Mark is 320 wide on a 512 field, inset 96.
  -->
  <rect width="512" height="512" rx="112" fill="#FAFAF8" />
  <g transform="translate(96 96) scale(21.3333)" fill="#111315" fill-rule="evenodd">
    <path d="M0,0 H7 V7 H0 Z M1,1 H6 V6 H1 Z M2,2 H5 V5 H2 Z" />
    <path d="M8,0 H15 V7 H8 Z M9,1 H14 V6 H9 Z M10,2 H13 V5 H10 Z" />
    <path d="M0,8 H7 V15 H0 Z M1,9 H6 V14 H1 Z M2,10 H5 V13 H2 Z" />
  </g>
</svg>
