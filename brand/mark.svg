<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 21 21" width="210" height="210"
     role="img" aria-label="qrrrgh">
  <title>qrrrgh</title>
  <!--
    QR code Version 1 finder geometry, exactly to specification: a 7x7 ring,
    a 1-module gap, a 3x3 core. That 1:1:3:1:1 ratio is what a decoder scans
    for along any line, so this is not a shape inspired by a QR code, it is
    the glyph that means "QR code" to a machine.

    The fourth corner is empty on purpose. A real QR code carries finders in
    only three corners, and the missing fourth is how a decoder works out
    which way up the code is. Here it does a second job: this app never
    reports that anything is safe, only that it found nothing. The corner
    where a promise would go is left open.
  -->
  <g fill="#111315" fill-rule="evenodd">
    <path d="M0,0 H7 V7 H0 Z M1,1 H6 V6 H1 Z M2,2 H5 V5 H2 Z" />
    <path d="M14,0 H21 V7 H14 Z M15,1 H20 V6 H15 Z M16,2 H19 V5 H16 Z" />
    <path d="M0,14 H7 V21 H0 Z M1,15 H6 V20 H1 Z M2,16 H5 V19 H2 Z" />
  </g>
</svg>
