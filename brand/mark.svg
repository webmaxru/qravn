<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7 7" width="210" height="210"
     role="img" aria-label="QRavn">
  <title>QRavn</title>
  <!--
    One QR finder pattern, to specification: a 7x7 ring, a 1-module gap, a 3x3
    core. Run a scan line through either centre and the module runs are still
    1:1:3:1:1 - the exact signature a decoder hunts for along any line. So this
    is not a shape inspired by a QR code. It is the glyph that means "QR code"
    to a machine.

    The ring is cut at the bottom right. Both arms stop a module and a half
    short and never meet. That break is the whole product in one gesture: this
    app reads a code and tells you what it found, and it never closes the loop
    for you by calling anything safe. The last move is yours.

    The break also does the job a real code gives its missing fourth finder -
    it kills the rotational symmetry, so the mark has an unambiguous up.

    Needs a 1-module quiet zone at minimum; 2 is better. Every other asset in
    this folder is this path, scaled.
  -->
  <path fill="#F1EDE6" fill-rule="evenodd"
        d="M0,0 H7 V5.5 H6 V1 H1 V6 H5.5 V7 H0 Z M2,2 H5 V5 H2 Z" />
</svg>
