<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500"
     role="img" aria-label="QRavn - du apner den ikke alene">
  <title>QRavn</title>
  <!--
    Play Store feature graphic. The lockup is held well inside the frame so
    Play's own crops cannot clip it.

    Norwegian, because the default listing language is Norwegian (Norway) and
    this graphic sits directly above that copy.

    No shield, no tick, no gradient: those are the three things every other
    result on this search carries, and all three promise protection this app
    does not offer. It reads a code and tells you what is in it.
  -->
  <rect width="1024" height="500" fill="#0C1519" />
  <path transform="translate(196 155) scale(27)" fill="#F1EDE6" fill-rule="evenodd"
        d="M0,0 H7 V5.5 H6 V1 H1 V6 H5.5 V7 H0 Z M2,2 H5 V5 H2 Z" />
  <text x="484" y="250" fill="#F1EDE6"
        font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace"
        font-size="94" letter-spacing="-2">QRavn</text>
  <text x="484" y="310" fill="#86B2C0"
        font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace"
        font-size="26">Du åpner den ikke alene.</text>
</svg>
