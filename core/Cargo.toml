[workspace]
members = [
    "crates/safety-core",
    "bindings/wasm",
    "bindings/android",
    "bindings/ios",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/webmaxru/qravn"

[workspace.dependencies]
idna = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
wasm-bindgen = "0.2"
unicode-security = "0.1"
