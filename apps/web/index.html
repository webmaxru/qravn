<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything on a notched iPhone. Without it the insets are always 0 and
         the shell cannot hold itself back from the notch or the home
         indicator once the app is installed to the home screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>QRavn — read a QR link before your camera app opens it</title>
    <meta
      name="description"
      content="Security professionals don't scan QR codes with the camera app: it gives you a cut-off preview and a button to open. QRavn reads the code instead and shows you the whole address, the real domain, and anything that looks wrong. Runs entirely on your device."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Paper in light, inverted paper in dark, matching the app surface. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121416" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-title" content="QRavn" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QRavn" />
    <meta property="og:title" content="QRavn — read a QR link before your camera app opens it" />
    <meta
      property="og:description"
      content="A camera app is built to open a QR link, not to check it. Read the whole address first — the real domain, and anything that looks wrong. Runs entirely on your device."
    />
    <meta property="og:url" content="https://qravn.isainative.dev/" />
    <meta property="og:image" content="https://qravn.isainative.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The QRavn mark: a single QR finder pattern with the ring left open at one corner."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
